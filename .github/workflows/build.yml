name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install cmake gmp sdl2

      - name: Configure
        run: cmake -B desktop/build -S desktop -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build desktop/build -j4

      - name: Package
        # ditto keeps the .app bundle intact (resource forks, symlinks) in a
        # way plain zip does not
        run: |
          mkdir -p dist
          ditto -c -k --sequesterRsrc --keepParent desktop/build/polyPi.app dist/polyPi-macos.zip

      - uses: actions/upload-artifact@v4
        with:
          name: polyPi-macos
          path: dist/polyPi-macos.zip

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (vcpkg)
        run: |
          vcpkg install gmp:x64-windows sdl2:x64-windows curl:x64-windows

      - name: Configure
        run: >
          cmake -B desktop/build -S desktop -A x64
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build desktop/build --config Release

      - name: Package
        shell: pwsh
        # zip the whole Release dir so the vcpkg-deployed DLLs ship with the exe
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Compress-Archive -Path desktop\build\Release\* -DestinationPath dist\polyPi-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: polyPi-windows
          path: dist/polyPi-windows.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/polyPi-macos/polyPi-macos.zip
            dist/polyPi-windows/polyPi-windows.zip
